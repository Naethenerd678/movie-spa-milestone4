<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Movie App</title>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Mustache -->
  <script src="https://unpkg.com/mustache@latest/mustache.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- JS -->
  <script src="script.js"></script>

</head>

<body>

  <h1>Movie App</h1>

  <!-- Tabs -->
  <div class="tab">
    <button onclick="openTab(event, 'Search_Results')">
      Search Results
    </button>

    <button onclick="openTab(event, 'Collections')">
      Collections
    </button>
  </div>

  <!-- SEARCH RESULTS TAB -->
  <div id="Search_Results" class="tabcontent">

    <h3>Search Results</h3>

    <!-- SEARCH -->
    <input
      type="text"
      id="searchInput"
      placeholder="Search movies..."
    >

    <button id="searchBtn" onclick="searchButtonOnClick()">
      Search
    </button>

    <!-- VIEW BUTTONS -->
    <button id="gridBtn">Grid</button>
    <button id="listBtn">List</button>

    <!-- PAGINATION -->
    <div>
      <button id="prevBtn">Prev</button>

      <span id="pageInfo"></span>

      <button id="nextBtn">Next</button>
    </div>

    <!-- DETAILS -->
    <div id="details"></div>

    <!-- RESULTS -->
    <div id="results" class="movie-grid grid-view"></div>

    <!-- MOVIE TEMPLATE -->
    <script id="movie-template" type="x-tmpl-mustache">

      <div class="movie-card" data-id="{{id}}">

        <img
          src="https://image.tmdb.org/t/p/w200{{poster_path}}"
        >

        <h3>{{title}}</h3>

        <p>{{vote_average}}</p>

      </div>

    </script>

    <!-- DETAILS TEMPLATE -->
    <script id="details-template" type="x-tmpl-mustache">

      <div>

        <h2>{{title}}</h2>

        <img
          src="https://image.tmdb.org/t/p/w300{{poster_path}}"
        >

        <p>{{overview}}</p>

      </div>

    </script>

  </div>

  <!-- COLLECTIONS TAB -->
  <div
    id="Collections"
    class="tabcontent"
    style="display:none;"
  >

    <h3>Collections</h3>

    <div id="movies" class="movie-grid grid-view"></div>

    <!-- COLLECTION TEMPLATE -->
    <script id="collections-template" type="text/template">

      {{#results}}

      <div class="movie-card">

        <img
          src="https://image.tmdb.org/t/p/w300{{poster_path}}"
          alt="{{title}}"
        >

        <h3>{{title}}</h3>

        <p>Rating: {{vote_average}}</p>

      </div>

      {{/results}}

    </script>

  </div>

</body>

</html>
